name: Workflow to check all status

on: 
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      
      - name: Simular compilacion
        run: echo "Compilando codigo..."
  
  test:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      
      - name: Simular ejecucion de pruebas
        run: echo "Simulando la ejecucion de tests..."
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      
      - name: Simular ejecucion de pruebas
        run: echo "Desplegar aplicacion..."

      - name: Simular deploy con error..
        run: exit 1
  
  notification-failure:
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: failure()
    steps:
      - name: Notificar fallo
        run: echo "Hubo un error al ejecutar el workflow..."