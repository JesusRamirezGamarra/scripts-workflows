name: Workflo to run scripts on

on:
  push:
    branches:
      - main

jobs:
  run-scripts:  # Corregido el nombre del job
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución
        run: |
          chmod +x ./scripts/*.sh

      - name: Ejecutar scripts
        run: |
          ./scripts/info.sh
          ./scripts/deploy.sh
          ./scripts/message.sh
        env:
          MESSAGE: "valor del mensaje pasado por variable de entorno"
