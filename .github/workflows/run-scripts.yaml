name: Workflow to run scripts on

on:
  push:
    branches:
      - main

env:
  Global_MESSAGE: "Hola desde el WORKFLOWS ..."

jobs:
  run-scripts:  
    runs-on: ubuntu-latest
    env:
      JOB_MESSAGE: "Hola JOB ..."
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución
        run: |
          chmod +x ./scripts/*.sh
      
      - name: Ejecutar script info
        run: ./scripts/info.sh

      - name: Ejecutar script deploy
        run: ./scripts/deploy.sh

      - name: Ejecutar script message
        run: ./scripts/message.sh
        env:
          MENSAJE: "valor del mensaje pasado por variable de entorno"
          SEGUNDO: "Otro valor"

      - name: Mostrar variables del workflow
        run: |
          echo "Job message: $JOB_MESSAGE, Name: $NAME, Global_MESSAGE: $Global_MESSAGE"
          echo "SECRECT Vars API_URL : ${{vars.API_URL}}"
        env:
          NAME: "Jesus Ramirez"

      - name: Valores del worflow ................
        run: |
          echo : "Tipo de evento: ${{ github.event_name }}"
          echo: "nombre del repositorio ${{github.repository}}"
          echo: "Rama: ${{github.ref}}"
          echo: "Autor: ${{github.actor}}"
          echo: "Mensaje: ${{github.event.head_commit.message}}"
          echo: "SHA: ${{github.sha}}"
          echo: "Usuario que lanzo el workflow: ${{github.actor}}"
          echo: "URL del repositorio: ${{github.event.repository.url}}"
          echo: "nro de ejecuicion workflow: ${{github.run_number}}"
          echo: "Mensaje de commit : ${{github.event.head_commit.message}}"
