name: Workflo to run scripts on

on:
  push:
    branches:
      - main
env:
  Global_MESSAGE: "Hola desde el WORKFLOWS  ..."

jobs:
  run-scripts:  # Corregido el nombre del job
    runs-on: ubuntu-latest
    env:
      JOB_MESSAGE: "Hola JOB ..."
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución
        run: |
          chmod +x ./scripts/*.sh
      
      - name: Ejecutar script info
        run: |
            ./scripts/info.sh

      - name: Ejecutar script deploy
        run: |
            ./scripts/deploy.sh

      - name: Ejecutar script message
        run: |
          ./scripts/message.sh
        env:
          MENSAJE: "valor del mensaje pasado por variable de entorno"
          SEGUNDO: "Otoro valor"

      - name: Mostrar variables del wordlow
        run: |
          echo "Job message: $JOB_MESSAGE" , Name :  $NAME , Global_MESSAGE: $Global_MESSAGE"
        env:
          NAME: "Jesus Ramirez"  